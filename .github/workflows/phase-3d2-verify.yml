name: phase-3d2-verify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - shell: bash
        run: |
          pnpm --dir tools/product-compiler exec prettier --write \
            src/compiled_graph.ts \
            src/graph_source.ts \
            src/project_migration_core.ts
          git diff --unified=0 -- \
            tools/product-compiler/src/compiled_graph.ts \
            tools/product-compiler/src/graph_source.ts \
            tools/product-compiler/src/project_migration_core.ts \
            | grep '^@@' || true
          exit 1
