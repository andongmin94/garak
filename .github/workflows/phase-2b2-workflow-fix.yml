name: Fix Phase 2B.2 workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Correct generated component import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/phase-2b2.yml')
          text = path.read_text(encoding='utf-8')
          corrected = text.replace(
              "import { ProductEvolutionPanel } from './ProductEvolutionPanel.mjs';",
              "import { ProductEvolutionPanel } from './ProductEvolutionPanel.js';",
          )
          if corrected != text:
              path.write_text(corrected, encoding='utf-8')
          PY

      - name: Commit correction to main
        shell: bash
        run: |
          if ! git diff --quiet -- .github/workflows/phase-2b2.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- .github/workflows/phase-2b2.yml
            git commit -m "ci: correct Phase 2B.2 component module path"
            git push origin HEAD:main
          fi
