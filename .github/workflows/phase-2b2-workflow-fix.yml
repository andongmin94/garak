name: Fix Phase 2B.2 workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Correct generated component import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/phase-2b2.yml')
          text = path.read_text(encoding='utf-8')
          old = "import { ProductEvolutionPanel } from './ProductEvolutionPanel.mjs';"
          new = "import { ProductEvolutionPanel } from './ProductEvolutionPanel.js';"

          if old not in text and new not in text:
              raise SystemExit('Phase 2B.2 component import marker is missing')

          corrected = text.replace(old, new)
          if corrected != text:
              path.write_text(corrected, encoding='utf-8', newline='\n')
          PY

      - name: Commit correction to main
        shell: bash
        run: |
          if ! git diff --quiet -- .github/workflows/phase-2b2.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- .github/workflows/phase-2b2.yml
            git commit -m "ci: correct Phase 2B.2 component module import"
            git push origin HEAD:main
          fi

