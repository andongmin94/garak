# One-time bounded remediation; remove after the validated source commit lands.
name: Phase 2B.1 import remediation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  typescript:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Activate pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - run: pnpm install --frozen-lockfile

      - name: Add the missing realpath import
        shell: pwsh
        run: |
          $path = 'tools/product-compiler/tests/project_persistence.test.ts'
          $text = [System.IO.File]::ReadAllText($path)
          $before = 'import { mkdir, readFile, rename, rm, writeFile } from "node:fs/promises";'
          $after = 'import { mkdir, readFile, realpath, rename, rm, writeFile } from "node:fs/promises";'
          if (-not $text.Contains($before) -and -not $text.Contains($after)) {
            throw 'Expected persistence test import was not found.'
          }
          $text = $text.Replace($before, $after)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          pnpm product:format
          git diff --check

      - name: Product Compiler gates
        shell: pwsh
        run: |
          pnpm product:lint
          pnpm product:typecheck
          pnpm product:test

      - name: Studio gates
        shell: pwsh
        run: |
          pnpm studio:format:check
          pnpm studio:lint
          pnpm studio:typecheck
          pnpm studio:test
          pnpm studio:build

      - name: Publish validated persistence source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/product-compiler/src/project_persistence.ts tools/product-compiler/tests/project_persistence.test.ts
          if (git diff --cached --quiet) {
            Write-Host 'No persistence source change remained.'
          } else {
            git commit -m "fix: complete phase 2B.1 persistence recovery gates"
            git push origin HEAD:main
          }

  native-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Native Debug smoke
        shell: pwsh
        run: |
          cmake --preset debug
          cmake --build --preset debug-build
          ctest --preset debug-test --no-tests=error

  report:
    if: always()
    needs: [typescript, native-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] Phase 2B.1 remediation ${context.sha}`;
            const body = [
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `TypeScript and Studio: ${{ needs.typescript.result }}`,
              `Native smoke: ${{ needs.native-smoke.result }}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
