name: Apply Phase 3D1 directly to main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-phase3d1-main-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: garak-direct-main-phase3d1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Confirm direct-main policy and clean stale refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -f plans/0018-phase-3d1-polarity-node.md
          grep -Fq -- '- Status: In Progress' plans/0018-phase-3d1-polarity-node.md
          while IFS= read -r full_ref; do
            [ -n "$full_ref" ] || continue
            branch="${full_ref#refs/heads/}"
            [ "$branch" = "main" ] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/" --jq '.[].ref')

      - name: Decode and apply preserved Phase 3D1 implementation
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/phase3d1-implementation.patch.gz.b64
          base64 --decode .github/phase3d1-implementation.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/phase3d1.patch"
          test -s "$RUNNER_TEMP/phase3d1.patch"
          git apply --check "$RUNNER_TEMP/phase3d1.patch"
          git apply "$RUNNER_TEMP/phase3d1.patch"
          git rm .github/phase3d1-implementation.patch.gz.b64
          git rm .github/workflows/apply-phase3d1-main-once.yml

      - name: Format affected first-party source
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile
          pnpm product:format
          pnpm studio:format
          mapfile -t cpp_files < <(git diff --name-only --diff-filter=ACMR -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | grep -v '^third_party/' || true)
          if [ "${#cpp_files[@]}" -gt 0 ]; then
            clang-format -i --style=file "${cpp_files[@]}"
          fi
          git diff --check

      - name: Run TypeScript and native local gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm product:format:check
          pnpm product:lint
          pnpm product:typecheck
          pnpm product:test
          pnpm studio:format:check
          pnpm studio:lint
          pnpm studio:typecheck
          pnpm studio:test
          pnpm studio:build
          cmake --preset debug --fresh
          cmake --build --preset debug-build --clean-first
          ctest --preset debug-test --no-tests=error
          cmake --preset release --fresh
          cmake --build --preset release-build --clean-first
          ctest --preset release-test --no-tests=error
          git diff --check

      - name: Enforce Phase 3D1 scope
        shell: bash
        run: |
          set -euo pipefail
          test -f native/dsp/polarity/include/garak/dsp/polarity/polarity.hpp
          test -f examples/products/artist-gain-inverted.garak/product.json
          grep -R --line-number --fixed-strings 'garak.polarity' tools/product-compiler native examples >/dev/null
          grep -R --line-number --fixed-strings '1001' tools/product-compiler native >/dev/null
          grep -R --line-number --fixed-strings '1002' tools/product-compiler native >/dev/null
          if git diff --name-only HEAD -- package.json pnpm-lock.yaml pnpm-workspace.yaml | grep -q .; then
            echo 'Phase 3D1 must not change workspace dependencies.' >&2
            exit 1
          fi
          if git diff --name-only HEAD -- '.github/workflows/*' | grep -v '^.github/workflows/apply-phase3d1-main-once.yml$' | grep -q .; then
            echo 'Unexpected workflow change in product implementation.' >&2
            exit 1
          fi
          git status --short

      - name: Commit implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          remote_before="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_before" = "$(git rev-parse HEAD)"
          git config user.name "Garak Direct Main Development"
          git config user.email "110483588+andongmin94@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Phase 3D1 polarity node"
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          remote_after="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_after" = "$source_sha"
          printf 'PHASE3D1_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm main remains the only branch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort)
          printf '%s\n' "${branches[@]}"
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = "main"
