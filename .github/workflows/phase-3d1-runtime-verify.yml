name: phase-3d1-runtime-verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm product:format:check
      - run: pnpm product:lint
      - run: pnpm product:typecheck
      - run: pnpm product:test
      - name: Apply canonical Inverted smoke formatting
        run: |
          set -euo pipefail
          file=native/tests/product_runtime_v1_inverted_tests.cpp
          clang-format -i --style=file "$file"
          if ! git diff --quiet -- "$file"; then
            git config user.name "andongmin94"
            git config user.email "110483588+andongmin94@users.noreply.github.com"
            git add -- "$file"
            git commit -m "style: apply canonical Inverted smoke formatting"
            git push origin HEAD:main
          fi
      - run: find native -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 clang-format --dry-run --Werror --style=file
      - run: cmake --preset debug --fresh
      - run: cmake --build --preset debug-build --clean-first
      - run: ctest --preset debug-test --no-tests=error
      - run: cmake --preset release --fresh
      - run: cmake --build --preset release-build --clean-first
      - run: ctest --preset release-test --no-tests=error
      - run: cmake --preset debug-warnings-as-errors --fresh -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build --preset warnings-as-errors-build --clean-first
      - run: ctest --test-dir out/build/debug-warnings-as-errors --no-tests=error
      - run: cmake --preset debug-clang-tidy --fresh -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build --preset clang-tidy-build --clean-first
