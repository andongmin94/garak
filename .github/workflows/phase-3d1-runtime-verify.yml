name: phase-3d1-runtime-verify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-diagnostic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cmake --preset product-runtime-debug --fresh
      - name: Build Inverted smoke target verbosely
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $output = & cmake --build out/build/product-runtime-debug --target garak_product_runtime_v1_inverted_tests --verbose 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath out/inverted-msvc-build.log
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inverted-msvc-build-log
          path: out/inverted-msvc-build.log
          if-no-files-found: error
      - shell: pwsh
        run: |
          if ('${{ steps.build.outputs.exit_code }}' -ne '0') { exit 1 }
