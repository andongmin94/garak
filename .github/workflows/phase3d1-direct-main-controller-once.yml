name: Complete Phase 3D1 directly on main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase3d1-direct-main-controller-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: garak-direct-main-phase3d1-controller
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      state: ${{ steps.prepare.outputs.state }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Prepare or recover the direct-main implementation
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -f plans/0018-phase-3d1-polarity-node.md

          while IFS= read -r full_ref; do
            [ -n "$full_ref" ] || continue
            branch="${full_ref#refs/heads/}"
            [ "$branch" = "main" ] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/" --jq '.[].ref')

          if grep -Fq -- '- Status: Complete' plans/0018-phase-3d1-polarity-node.md \
             && test -f native/dsp/polarity/include/garak/dsp/polarity/polarity.hpp \
             && test -f examples/products/artist-gain-inverted.garak/product.json; then
            echo 'state=complete' >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! test -f native/dsp/polarity/include/garak/dsp/polarity/polarity.hpp; then
            recovered=false

            if test -s .github/phase3d1-implementation.patch.gz.b64; then
              base64 --decode .github/phase3d1-implementation.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/phase3d1.patch"
              if test -s "$RUNNER_TEMP/phase3d1.patch" && git apply --check "$RUNNER_TEMP/phase3d1.patch"; then
                git apply "$RUNNER_TEMP/phase3d1.patch"
                recovered=true
              fi
            fi

            if [ "$recovered" = false ]; then
              candidates=(
                9fd2fb9a880ec239a13d97c168a7657ebcc8e407
                0d814fb78ef7fcef09ee21a5a157691607400db8
                d8053d123041612ae1e7cd4e3f6e7bf2eee54b5b
                5f3b5444ecec678a57b20ad0901af815a315df9c
                f488d651f1829ef5739f0daa952aea634823fe29
                867b6095cbd8ab6f3a5c9c9f2ad6ab3e99b980d8
              )
              for candidate in "${candidates[@]}"; do
                git fetch --no-tags origin "$candidate" >/dev/null 2>&1 || true
                if git cat-file -e "$candidate:native/dsp/polarity/include/garak/dsp/polarity/polarity.hpp" 2>/dev/null \
                   && git cat-file -e "$candidate:examples/products/artist-gain-inverted.garak/product.json" 2>/dev/null; then
                  mapfile -t paths < <(git diff --name-only --diff-filter=ACMRD ccdf0b89a48830bcc7ac99047e00a77b855df9fb "$candidate" -- \
                    ':(exclude).github/**' \
                    ':(exclude)AGENTS.md' \
                    ':(exclude)plans/0018-phase-3d1-polarity-node.md')
                  for path in "${paths[@]}"; do
                    if git cat-file -e "$candidate:$path" 2>/dev/null; then
                      git checkout "$candidate" -- "$path"
                    else
                      rm -rf -- "$path"
                    fi
                  done
                  recovered=true
                  break
                fi
              done
            fi

            if [ "$recovered" = false ]; then
              echo 'No preserved Phase 3D1 implementation could be recovered.' >&2
              exit 1
            fi
          fi

          rm -f .github/phase3d1-implementation.patch.gz.b64
          rm -f .github/workflows/apply-phase3d1-main-once.yml
          rm -f .github/workflows/verify-phase3d1-main-once.yml

          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile
          pnpm product:format
          pnpm studio:format
          mapfile -t cpp_files < <(git diff --name-only --diff-filter=ACMR -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | grep -v '^third_party/' || true)
          if [ "${#cpp_files[@]}" -gt 0 ]; then
            clang-format -i --style=file "${cpp_files[@]}"
          fi
          git diff --check
          pnpm product:format:check
          pnpm product:lint
          pnpm product:typecheck
          pnpm product:test
          pnpm studio:format:check
          pnpm studio:lint
          pnpm studio:typecheck
          pnpm studio:test
          pnpm studio:build
          cmake --preset debug --fresh
          cmake --build --preset debug-build --clean-first
          ctest --preset debug-test --no-tests=error
          cmake --preset release --fresh
          cmake --build --preset release-build --clean-first
          ctest --preset release-test --no-tests=error

          test -f native/dsp/polarity/include/garak/dsp/polarity/polarity.hpp
          test -f examples/products/artist-gain-inverted.garak/product.json
          grep -R --line-number --fixed-strings 'garak.polarity' tools/product-compiler native examples >/dev/null
          if git diff --name-only HEAD -- package.json pnpm-lock.yaml pnpm-workspace.yaml | grep -q .; then
            echo 'Unexpected dependency change.' >&2
            exit 1
          fi

          git config user.name "Garak Direct Main Development"
          git config user.email "110483588+andongmin94@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Phase 3D1 polarity node"
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$source_sha"
          echo 'state=verify' >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    if: needs.prepare.outputs.state == 'verify'
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Check out exact source and recursive SDK graph
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify exact direct-main Phase 3D1 source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Wrong source SHA.' }
          if (-not (Test-Path 'native/dsp/polarity/include/garak/dsp/polarity/polarity.hpp')) { throw 'Polarity DSP is missing.' }
          if (-not (Test-Path 'examples/products/artist-gain-inverted.garak/product.json')) { throw 'Inverted product is missing.' }
          $status = @(git submodule status --recursive)
          if (@($status | Where-Object { $_ -match '^[+-U]' }).Count -ne 0) { throw 'Recursive SDK pin mismatch.' }
          git diff --check
          $files = @(git ls-files -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | Where-Object { $_ -notlike 'third_party/*' })
          & clang-format --dry-run --Werror --style=file @files
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile
          pnpm product:format:check
          pnpm product:lint
          pnpm product:typecheck
          pnpm product:test
          pnpm studio:format:check
          pnpm studio:lint
          pnpm studio:typecheck
          pnpm studio:test
          pnpm studio:build
          cmake --preset product-runtime-debug --fresh
          cmake --build --preset product-runtime-debug-build --clean-first
          pnpm product:export --project examples/products/artist-gain-warm.garak --configuration Debug --output out/exports/phase-3d1/debug --force --validate
          pnpm product:export --project examples/products/artist-gain-bright.garak --configuration Debug --output out/exports/phase-3d1/debug --force --validate
          pnpm product:export --project examples/products/artist-gain-inverted.garak --configuration Debug --output out/exports/phase-3d1/debug --force --validate
          ctest --preset product-runtime-debug-test --no-tests=error
          pnpm --dir studio verify:product-workflow --configuration Debug
          cmake --preset product-runtime-release --fresh
          cmake --build --preset product-runtime-release-build --clean-first
          pnpm product:export --project examples/products/artist-gain-warm.garak --configuration Release --output out/exports/phase-3d1/release --force --validate
          pnpm product:export --project examples/products/artist-gain-bright.garak --configuration Release --output out/exports/phase-3d1/release --force --validate
          pnpm product:export --project examples/products/artist-gain-inverted.garak --configuration Release --output out/exports/phase-3d1/release --force --validate
          ctest --preset product-runtime-release-test --no-tests=error
          pnpm --dir studio verify:product-workflow --configuration Release
          cmake --preset product-runtime-werror --fresh
          cmake --build --preset product-runtime-werror-build --clean-first
          cmake --preset product-runtime-clang-tidy --fresh
          cmake --build --preset product-runtime-clang-tidy-build --clean-first
          $changes = @(git status --porcelain --untracked-files=no)
          if ($changes.Count -ne 0) { $changes | ForEach-Object { Write-Error $_ }; throw 'Verification rewrote tracked source.' }
          $remote = git ls-remote origin refs/heads/main
          if (($remote -split "`t")[0] -ne $env:SOURCE_SHA) { throw 'Main moved during verification.' }

  finalize:
    needs: [prepare, windows]
    if: needs.prepare.outputs.state == 'verify' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      VERIFY_RUN: ${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record acceptance and remove controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          source = os.environ['SOURCE_SHA']
          run = os.environ['VERIFY_RUN']
          plan_path = Path('plans/0018-phase-3d1-polarity-node.md')
          plan = plan_path.read_text(encoding='utf-8')
          plan = plan.replace('- Status: In Progress', '- Status: Complete', 1)
          plan = re.sub(r'(?m)^([0-9]+\. )\[ \]', r'\1[x]', plan)
          marker = '## 완료 기록\n\n'
          completion = (
              f'Phase 3D1 is complete. Exact direct-main source `{source}` passed clean Windows run `{run}`. '
              'The full Product Compiler, Studio, Debug/Release export and official Validator, CTest, Studio workflow, '
              'warnings-as-errors, clang-tidy, and tracked-source-mutation matrix passed. Existing Product/FUID/Parameter/state '
              'contracts and whole-product Bypass are preserved.\n'
          )
          start = plan.find(marker)
          end = plan.find('\n## 다음 단계', start + len(marker)) if start >= 0 else -1
          if start >= 0 and end >= 0:
              plan = plan[:start + len(marker)] + completion + plan[end:]
          plan_path.write_text(plan, encoding='utf-8', newline='\n')

          additions = {
              'README.md': f'''\n### Phase 3D1 — Polarity Node — Complete\n\nExact direct-main source `{source}` passed clean Windows run `{run}`. Current products support the exact Gain-only and Gain→Polarity plans, project schema v4, graph source v2, deterministic `GARAKGRF` 1.1, whole-product Bypass, and the `Artist Gain Inverted` reference product. Phase 3D remains In Progress.\n''',
              'ROADMAP.md': f'''\n### Phase 3D1 — Polarity Node — Complete\n\n- exact verified main source: `{source}`\n- clean Windows run: `{run}`\n- fixed parameterless Polarity v1\n- project schema v4 / graph source v2 / `GARAKGRF` 1.1\n- Warm/Bright preserved; Inverted product accepted\n''',
              'docs/status/current.md': f'''\n### Phase 3D1 — Polarity Node — Complete\n\nExact direct-main source `{source}` passed clean Windows run `{run}`. Runtime supports the exact Gain-only and Gain→Polarity plans with whole-product Bypass and allocation-free processing. The next increment is Phase 3D2.\n''',
          }
          for path, addition in additions.items():
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if '### Phase 3D1 — Polarity Node — Complete' not in text:
                  text += addition
              if path == 'ROADMAP.md':
                  text = text.replace('## Phase 3D — Initial DSP Node Set — Planned', '## Phase 3D — Initial DSP Node Set — In Progress')
              file.write_text(text, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/phase3d1-direct-main-controller-once.yml
          rm -f .github/workflows/apply-phase3d1-main-once.yml .github/workflows/verify-phase3d1-main-once.yml
          git add -A
          git config user.name "Garak Direct Main Development"
          git config user.email "110483588+andongmin94@users.noreply.github.com"
          git diff --cached --check
          git commit -m "docs: accept Phase 3D1 polarity node"
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$final_sha"
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = "main"

  cleanup-complete:
    needs: prepare
    if: needs.prepare.outputs.state == 'complete'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove one-time controller from completed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Clean one-time files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase3d1-direct-main-controller-once.yml
          rm -f .github/workflows/apply-phase3d1-main-once.yml .github/workflows/verify-phase3d1-main-once.yml .github/phase3d1-implementation.patch.gz.b64
          git add -A
          git config user.name "Garak Direct Main Development"
          git config user.email "110483588+andongmin94@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove Phase 3D1 one-time workflows"
            git push origin HEAD:main
          fi
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = "main"
