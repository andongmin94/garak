name: Apply Phase 3C1 patch

on:
  push:
    branches:
      - main
    paths:
      - tools/phase3c1_apply.py
      - .github/workflows/apply-phase3c1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garak-phase3c1-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install exact workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile

      - name: Adapt the one-time patch to the current processor source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/phase3c1_apply.py')
          text = path.read_text(encoding='utf-8')
          old = r'''def replace_exact(relative: str, old: str, new: str, expected: int = 1) -> None:
              path = ROOT / relative
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(
                      f"{relative}: expected {expected} occurrence(s), found {count}: {old[:120]!r}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          '''
          replacement = r'''def replace_exact(relative: str, old: str, new: str, expected: int = 1) -> None:
              path = ROOT / relative
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              processor_execution_plan = (
                  "      kExecutionPlan, garak::runtime::product_v1::kGainParameterId,\n"
              )
              if (
                  relative == "native/adapters/vst3/product_runtime_v1/processor.cpp"
                  and old == processor_execution_plan
                  and expected == 1
              ):
                  if count != 2:
                      raise RuntimeError(
                          f"{relative}: expected two execution-plan calls, found {count}"
                      )
                  path.write_text(
                      text.replace(old, new, 1), encoding="utf-8", newline="\n"
                  )
                  return
              if count != expected:
                  raise RuntimeError(
                      f"{relative}: expected {expected} occurrence(s), found {count}: {old[:120]!r}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one replace_exact definition, found {text.count(old)}')
          path.write_text(text.replace(old, replacement), encoding='utf-8', newline='\n')
          PY

      - name: Apply exact Phase 3C1 changes
        run: python tools/phase3c1_apply.py

      - name: Format changed first-party sources
        shell: bash
        run: |
          pnpm product:format
          pnpm studio:format
          clang-format -i --style=file \
            native/adapters/vst3/product_runtime_v1/product_runtime_context.hpp \
            native/adapters/vst3/product_runtime_v1/product_runtime_loader_win.cpp \
            native/adapters/vst3/product_runtime_v1/product_runtime_loader_win.hpp \
            native/adapters/vst3/product_runtime_v1/controller.cpp \
            native/adapters/vst3/product_runtime_v1/factory.cpp \
            native/adapters/vst3/product_runtime_v1/factory_support.cpp \
            native/adapters/vst3/product_runtime_v1/factory_support.hpp \
            native/adapters/vst3/product_runtime_v1/processor.cpp \
            native/adapters/vst3/product_runtime_v1/processor.hpp

      - name: Remove one-time patch machinery
        shell: bash
        run: |
          rm -f .github/workflows/apply-phase3c1.yml
          rm -f tools/phase3c1_apply.py

      - name: Commit the verified product-path change
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Phase 3C1 patch produced no changes.' >&2
            exit 1
          fi
          git commit -m 'feat: load compiled graph resource in product runtime'
          git push origin HEAD:main
