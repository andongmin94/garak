name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify clean exact commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all --ignore-submodules=none)"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-19 clang-format-19 clang-tidy-19 ninja-build
          clang++-19 --version
          clang-format-19 --version
          clang-tidy-19 --version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm product:format:check
      - run: pnpm product:lint
      - run: pnpm product:typecheck
      - run: pnpm product:test
      - run: pnpm studio:format:check
      - run: pnpm studio:lint
      - run: pnpm studio:typecheck
      - run: pnpm studio:test
      - run: pnpm studio:build
      - name: Check first-party native formatting
        run: find native -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 clang-format-19 --dry-run --Werror --style=file
      - run: cmake --preset debug --fresh
      - run: cmake --build --preset debug-build --clean-first
      - run: ctest --preset debug-test --no-tests=error
      - run: cmake --preset release --fresh
      - run: cmake --build --preset release-build --clean-first
      - run: ctest --preset release-test --no-tests=error
      - run: cmake --preset debug-warnings-as-errors --fresh -DCMAKE_CXX_COMPILER=clang++-19
      - run: cmake --build --preset warnings-as-errors-build --clean-first
      - run: ctest --test-dir out/build/debug-warnings-as-errors --no-tests=error --output-on-failure
      - run: cmake --preset debug-clang-tidy --fresh -DCMAKE_CXX_COMPILER=clang++-19 -DGARAK_CLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-19
      - run: cmake --build --preset clang-tidy-build --clean-first
      - name: Verify source remained clean
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          changes="$(git status --porcelain --untracked-files=all --ignore-submodules=none)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify clean exact commit
        run: |
          $head = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw 'Checkout does not match the requested main commit.'
          }
          & git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Checkout has tracked changes.' }
          & git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Checkout has staged changes.' }
          $changes = @(& git status --porcelain --untracked-files=all --ignore-submodules=none)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 0) {
            $changes | Write-Output
            throw 'Checkout has modified or untracked source.'
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Report native tools
        run: |
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake is unavailable.' }
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw 'Ninja is unavailable.' }
          clang-tidy --version
          if ($LASTEXITCODE -ne 0) { throw 'clang-tidy is unavailable.' }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm product:format:check
      - run: pnpm product:lint
      - run: pnpm product:typecheck
      - run: pnpm product:test
      - run: pnpm studio:format:check
      - run: pnpm studio:lint
      - run: pnpm studio:typecheck
      - run: pnpm studio:test
      - run: pnpm studio:build
      - run: cmake --preset product-runtime-debug --fresh
      - run: cmake --build --preset product-runtime-debug-build --clean-first
      - name: Verify four-product Debug export, inspector and official Validator
        run: ./tools/product-compiler/scripts/verify_headless_export_no_build.ps1 -Configuration Debug
      - name: Verify Debug legacy migration export parity
        run: ./tools/product-compiler/scripts/verify_project_migration_export_parity.ps1 -Configuration Debug
      - run: ctest --preset product-runtime-debug-test --no-tests=error
      - run: pnpm --dir studio verify:product-workflow --configuration Debug
      - run: cmake --preset product-runtime-release --fresh
      - run: cmake --build --preset product-runtime-release-build --clean-first
      - name: Verify four-product Release export, inspector and official Validator
        run: ./tools/product-compiler/scripts/verify_headless_export_no_build.ps1 -Configuration Release
      - name: Verify Release legacy migration export parity
        run: ./tools/product-compiler/scripts/verify_project_migration_export_parity.ps1 -Configuration Release
      - run: ctest --preset product-runtime-release-test --no-tests=error
      - run: pnpm --dir studio verify:product-workflow --configuration Release
      - run: cmake --preset product-runtime-werror --fresh
      - run: cmake --build --preset product-runtime-werror-build --clean-first
      - run: cmake --preset product-runtime-clang-tidy --fresh
      - name: Build with Windows clang-tidy
        run: |
          $output = @(& cmake --build --preset product-runtime-clang-tidy-build --clean-first 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $pattern = 'error:|warning:|FAILED:|clang-tidy|bugprone-|cert-|clang-analyzer-|cppcoreguidelines-|misc-|modernize-|performance-|portability-|readability-'
            $diagnostics = @($output | Select-String -Pattern $pattern | ForEach-Object { $_.Line })
            if ($diagnostics.Count -eq 0) {
              $output | Select-Object -Last 120 | ForEach-Object { $_ }
            } else {
              $diagnostics | ForEach-Object { $_ }
            }
            exit $exitCode
          }
      - name: Verify source remained clean
        if: always()
        run: |
          $head = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw 'Verification changed the requested main commit.'
          }
          & git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Verification changed tracked source.' }
          & git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Verification staged source changes.' }
          $changes = @(& git status --porcelain --untracked-files=all --ignore-submodules=none)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 0) {
            $changes | Write-Output
            throw 'Verification left modified or untracked source.'
          }
      - name: Retain Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-${{ github.sha }}
          path: |
            out/reports/**/*.json
            out/build/**/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
