name: Verify and finalize Phase 3D1 on main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-phase3d1-main-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garak-direct-main-phase3d1
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Check out exact main source and recursive SDK graph
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify source identity and Phase 3D1 contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -ne '${{ github.sha }}') { throw 'Wrong source SHA.' }
          if (-not (Test-Path 'native/dsp/polarity/include/garak/dsp/polarity/polarity.hpp')) { throw 'Polarity DSP is missing.' }
          if (-not (Test-Path 'examples/products/artist-gain-inverted.garak/product.json')) { throw 'Inverted reference product is missing.' }
          if (-not (Test-Path 'plans/0018-phase-3d1-polarity-node.md')) { throw 'Phase 3D1 ExecPlan is missing.' }
          $plan = Get-Content 'plans/0018-phase-3d1-polarity-node.md' -Raw
          if ($plan -notmatch '(?m)^- Status: In Progress$') { throw 'Source gate expects acceptance-pending plan status.' }
          if (Test-Path '.github/phase3d1-implementation.patch.gz.b64') { throw 'Implementation patch artifact must not remain.' }
          $status = @(git submodule status --recursive)
          if (@($status | Where-Object { $_ -match '^[+-U]' }).Count -ne 0) { throw 'Recursive SDK pin mismatch.' }
          git diff --check
          $badEol = @(git ls-files --eol | Select-String 'w/(crlf|mixed)')
          if ($badEol.Count -ne 0) { throw 'Tracked first-party text must use LF working-tree line endings.' }
          $files = @(git ls-files -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | Where-Object { $_ -notlike 'third_party/*' })
          & clang-format --dry-run --Werror --style=file @files

      - name: Install exact workspace dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify Product Compiler and Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm product:format:check
          pnpm product:lint
          pnpm product:typecheck
          pnpm product:test
          pnpm studio:format:check
          pnpm studio:lint
          pnpm studio:typecheck
          pnpm studio:test
          pnpm studio:build

      - name: Build, export and validate Debug products
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --preset product-runtime-debug --fresh
          cmake --build --preset product-runtime-debug-build --clean-first
          pnpm product:export --project examples/products/artist-gain-warm.garak --configuration Debug --output out/exports/phase-3d1/debug --force --validate
          pnpm product:export --project examples/products/artist-gain-bright.garak --configuration Debug --output out/exports/phase-3d1/debug --force --validate
          pnpm product:export --project examples/products/artist-gain-inverted.garak --configuration Debug --output out/exports/phase-3d1/debug --force --validate
          ctest --preset product-runtime-debug-test --no-tests=error
          pnpm --dir studio verify:product-workflow --configuration Debug

      - name: Build, export and validate Release products
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --preset product-runtime-release --fresh
          cmake --build --preset product-runtime-release-build --clean-first
          pnpm product:export --project examples/products/artist-gain-warm.garak --configuration Release --output out/exports/phase-3d1/release --force --validate
          pnpm product:export --project examples/products/artist-gain-bright.garak --configuration Release --output out/exports/phase-3d1/release --force --validate
          pnpm product:export --project examples/products/artist-gain-inverted.garak --configuration Release --output out/exports/phase-3d1/release --force --validate
          ctest --preset product-runtime-release-test --no-tests=error
          pnpm --dir studio verify:product-workflow --configuration Release

      - name: Verify strict first-party gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --preset product-runtime-werror --fresh
          cmake --build --preset product-runtime-werror-build --clean-first
          cmake --preset product-runtime-clang-tidy --fresh
          cmake --build --preset product-runtime-clang-tidy-build --clean-first
          $changes = @(git status --porcelain --untracked-files=no)
          if ($changes.Count -ne 0) {
            $changes | ForEach-Object { Write-Error $_ }
            throw 'Verification rewrote tracked source.'
          }
          $remote = git ls-remote origin refs/heads/main
          if (($remote -split "`t")[0] -ne '${{ github.sha }}') { throw 'Main moved during exact-source verification.' }

  finalize:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact verified main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record acceptance and remove one-time verifier
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          VERIFY_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          source = os.environ['SOURCE_SHA']
          run = os.environ['VERIFY_RUN']

          plan_path = Path('plans/0018-phase-3d1-polarity-node.md')
          plan = plan_path.read_text(encoding='utf-8')
          plan = plan.replace('- Status: In Progress', '- Status: Complete', 1)
          plan = re.sub(r'(?m)^([0-9]+\. )\[ \]', r'\1[x]', plan)
          old_completion = 'Implementation has not started. This plan is the first Phase 3D1 source change and was committed directly to `main`.'
          completion = (
              f'Phase 3D1 is complete. Exact direct-main source `{source}` passed clean Windows run `{run}`: '
              'Product Compiler and Studio format/lint/typecheck/test/build, Debug/Release Warm/Bright/Inverted actual export '
              'and official Validator, CTest, Studio workflow, warnings-as-errors, clang-tidy, and tracked-source mutation zero. '
              'The fixed parameterless Polarity node preserves whole-product bypass and existing Product/FUID/Parameter/state contracts.'
          )
          if old_completion in plan:
              plan = plan.replace(old_completion, completion, 1)
          elif completion not in plan:
              plan += '\n' + completion + '\n'
          plan = re.sub(
              r'(?s)## 다음 단계\n\n.*?\Z',
              '## 다음 단계\n\nStart Phase 3D2 as a separate ExecPlan on the accepted direct-main Polarity baseline.\n',
              plan,
          )
          plan_path.write_text(plan, encoding='utf-8', newline='\n')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          section = f'''\n### Phase 3D1 — Polarity Node — Complete\n\n- fixed parameterless `garak.polarity` implementation 1\n- project schema v4 / graph source v2\n- exact Gain-only and Gain→Polarity linear topologies\n- deterministic `GARAKGRF` 1.1\n- whole-product sample-accurate Bypass preservation\n- `Artist Gain Inverted` Debug/Release export and official Validator coverage\n- exact verified main source: `{source}`\n- clean Windows run: `{run}`\n\nPhase 3D remains In Progress. The next increment is Phase 3D2.\n'''
          if '### Phase 3D1 — Polarity Node — Complete' not in readme:
              marker = '\n## 제거된 기술 spike'
              readme = readme.replace(marker, section + marker, 1) if marker in readme else readme + section
          readme_path.write_text(readme, encoding='utf-8', newline='\n')

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap = roadmap.replace('## Phase 3D — Initial DSP Node Set — Planned', '## Phase 3D — Initial DSP Node Set — In Progress')
          phase = f'''\n### Phase 3D1 — Polarity Node — Complete\n\n- exact verified main source: `{source}`\n- clean Windows run: `{run}`\n- fixed parameterless Polarity v1\n- schema v4 / graph source v2 / `GARAKGRF` 1.1\n- Warm/Bright behavior preserved; Inverted product accepted\n\n### Phase 3D2 — Next DSP Node — Pending\n\nSelect and implement the next smallest end-to-end node in a separate ExecPlan.\n'''
          if '### Phase 3D1 — Polarity Node — Complete' not in roadmap:
              marker = '\n## Phase 4 — Parameter and Macro System'
              roadmap = roadmap.replace(marker, phase + marker, 1) if marker in roadmap else roadmap + phase
          roadmap_path.write_text(roadmap, encoding='utf-8', newline='\n')

          status_path = Path('docs/status/current.md')
          status = status_path.read_text(encoding='utf-8')
          block = f'''\n### Phase 3D1 — Polarity Node — Complete\n\nExact main source `{source}` passed clean Windows run `{run}`. Current editable projects use schema v4 and graph source v2. Runtime supports the exact Gain-only and Gain→Polarity plans with deterministic `GARAKGRF` 1.1, whole-product Bypass, and allocation-free processing. The next increment is Phase 3D2.\n'''
          if '### Phase 3D1 — Polarity Node — Complete' not in status:
              marker = '\n## 명시적으로 아직 완료하지 않은 영역'
              status = status.replace(marker, block + marker, 1) if marker in status else status + block
          status_path.write_text(status, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/verify-phase3d1-main-once.yml
          git config user.name "Garak Direct Main Development"
          git config user.email "110483588+andongmin94@users.noreply.github.com"
          git add README.md ROADMAP.md docs/status/current.md plans/0018-phase-3d1-polarity-node.md
          git diff --cached --check
          git commit -m "docs: accept Phase 3D1 polarity node"
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$final_sha"

      - name: Confirm direct-main repository shape
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort)
          printf '%s\n' "${branches[@]}"
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = "main"
          test -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq '.[].number')"
