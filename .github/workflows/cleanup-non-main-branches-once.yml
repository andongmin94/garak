name: One-time cleanup of non-main branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-non-main-branches-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: garak-one-time-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify default branch
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          test "$default_branch" = "main"
          test "$(git branch --show-current)" = "main"

      - name: Cancel other queued and running workflow runs
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress waiting requested pending; do
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null || true)
          done
          sleep 15

      - name: Close open pull requests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --comment "Closed during the repository-wide branch cleanup. Work continues directly on main." || true
          done < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number --jq '.[].number')

      - name: Delete every branch except main
        shell: bash
        run: |
          set -euo pipefail

          delete_non_main_refs() {
            while IFS= read -r full_ref; do
              [ -n "$full_ref" ] || continue
              branch="${full_ref#refs/heads/}"
              [ "$branch" = "main" ] && continue
              echo "Deleting $branch"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/" --jq '.[].ref')
          }

          delete_non_main_refs
          sleep 10
          delete_non_main_refs

          for attempt in $(seq 1 10); do
            mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort)
            if [ "${#branches[@]}" -eq 1 ] && [ "${branches[0]}" = "main" ]; then
              printf 'Remaining branch: %s\n' "${branches[0]}"
              exit 0
            fi
            printf 'Attempt %s; remaining branches:\n' "$attempt"
            printf '  %s\n' "${branches[@]}"
            delete_non_main_refs
            sleep 3
          done

          echo "Non-main branches remain after cleanup." >&2
          exit 1

      - name: Persist direct-main policy and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          marker='## Branch 운영 정책'
          if ! grep -Fq "$marker" AGENTS.md; then
            printf '%s\n' \
              '' \
              '## Branch 운영 정책' \
              '' \
              '- 이 저장소의 개발 작업은 사용자 지시에 따라 `main`에서 직접 수행한다.' \
              '- `agent/*`, feature, verification, cleanup 또는 release branch를 만들지 않는다.' \
              '- Pull request를 개발·검증의 중간 저장소로 사용하지 않는다.' \
              '- 검증은 정확한 `main` commit의 clean checkout을 대상으로 수행하고, 실패하면 다음 수정도 `main`에 직접 반영한다.' \
              '- 일회성 검증 workflow가 불가피하면 `main`에 추가하고 같은 작업 안에서 제거하여 최종 source tree에 남기지 않는다.' \
              '- 현재 요구를 충족하지 않는 과거 branch·workflow·compatibility path는 보존하지 않는다.' \
              >> AGENTS.md
          fi

          git rm .github/workflows/cleanup-non-main-branches-once.yml
          git config user.name "Garak Repository Cleanup"
          git config user.email "110483588+andongmin94@users.noreply.github.com"
          git add AGENTS.md
          git diff --cached --check
          git commit -m "chore: enforce direct-main development"
          git push origin HEAD:main

      - name: Confirm branch cleanup after final main push
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort)
          printf 'Final branches:\n'
          printf '  %s\n' "${branches[@]}"
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = "main"
