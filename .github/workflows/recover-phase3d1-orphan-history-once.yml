name: Recover Phase 3D1 orphan history on main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-phase3d1-orphan-history-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garak-direct-main-phase3d1-controller
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      state: ${{ steps.recover.outputs.state }}
      source_sha: ${{ steps.recover.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Recover implementation from deleted-ref object history
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          if test -f native/dsp/polarity/include/garak/dsp/polarity/polarity.hpp \
             && test -f examples/products/artist-gain-inverted.garak/product.json; then
            echo 'state=present' >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          heads=(
            9fd2fb9a880ec239a13d97c168a7657ebcc8e407
            0d814fb78ef7fcef09ee21a5a157691607400db8
            d8053d123041612ae1e7cd4e3f6e7bf2eee54b5b
            5f3b5444ecec678a57b20ad0901af815a315df9c
            f488d651f1829ef5739f0daa952aea634823fe29
            41fda0a80fc308578a4ae045dad6579424256f25
            867b6095cbd8ab6f3a5c9c9f2ad6ab3e99b980d8
            11c9b00fa54bdb607634f698109a7a975ada06ec
            78b2d193e2f82c7f0fc84a76fd23f077f6b6f73e
            bf9482cf301cd87c6e09ae2f424d750a8bb2546c
          )
          for sha in "${heads[@]}"; do
            git fetch --no-tags origin "$sha" >/dev/null 2>&1 || true
          done

          found=''
          while IFS= read -r commit; do
            if git cat-file -e "$commit:native/dsp/polarity/include/garak/dsp/polarity/polarity.hpp" 2>/dev/null \
               && git cat-file -e "$commit:examples/products/artist-gain-inverted.garak/product.json" 2>/dev/null; then
              found="$commit"
              break
            fi
          done < <(for sha in "${heads[@]}"; do git rev-list "$sha" 2>/dev/null || true; done | awk '!seen[$0]++')

          if [ -z "$found" ]; then
            echo 'No orphan commit with complete Polarity source was found.' >&2
            exit 1
          fi
          echo "Recovering Phase 3D1 source from $found"

          mapfile -t paths < <(git diff --name-only --diff-filter=ACMRD ccdf0b89a48830bcc7ac99047e00a77b855df9fb "$found" -- \
            ':(exclude).github/**' \
            ':(exclude)AGENTS.md' \
            ':(exclude)plans/0018-phase-3d1-polarity-node.md' \
            | awk 'NF')
          test "${#paths[@]}" -gt 0
          for path in "${paths[@]}"; do
            if git cat-file -e "$found:$path" 2>/dev/null; then
              git checkout "$found" -- "$path"
            else
              rm -rf -- "$path"
            fi
          done

          rm -f .github/phase3d1-implementation.patch.gz.b64
          rm -f .github/workflows/apply-phase3d1-main-once.yml
          rm -f .github/workflows/verify-phase3d1-main-once.yml
          rm -f .github/workflows/phase3d1-direct-main-controller-once.yml
          rm -f .github/workflows/reconcile-phase3d1-start-phase3d2-once.yml

          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile
          pnpm product:format
          pnpm studio:format
          mapfile -t cpp_files < <(git diff --name-only --diff-filter=ACMR -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | grep -v '^third_party/' || true)
          if [ "${#cpp_files[@]}" -gt 0 ]; then clang-format -i --style=file "${cpp_files[@]}"; fi
          git diff --check
          pnpm product:format:check
          pnpm product:lint
          pnpm product:typecheck
          pnpm product:test
          pnpm studio:format:check
          pnpm studio:lint
          pnpm studio:typecheck
          pnpm studio:test
          pnpm studio:build
          cmake --preset debug --fresh
          cmake --build --preset debug-build --clean-first
          ctest --preset debug-test --no-tests=error
          cmake --preset release --fresh
          cmake --build --preset release-build --clean-first
          ctest --preset release-test --no-tests=error
          test -f native/dsp/polarity/include/garak/dsp/polarity/polarity.hpp
          test -f examples/products/artist-gain-inverted.garak/product.json
          if git diff --name-only HEAD -- package.json pnpm-lock.yaml pnpm-workspace.yaml | grep -q .; then
            echo 'Unexpected dependency change.' >&2
            exit 1
          fi

          git config user.name "Garak Direct Main Development"
          git config user.email "110483588+andongmin94@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: recover Phase 3D1 polarity node"
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$source_sha"
          echo 'state=recovered' >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  windows:
    needs: recover
    if: needs.recover.outputs.state == 'recovered'
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.recover.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Run full exact-source acceptance matrix
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.recover.outputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Wrong source SHA.' }
          git diff --check
          $files = @(git ls-files -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | Where-Object { $_ -notlike 'third_party/*' })
          & clang-format --dry-run --Werror --style=file @files
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile
          pnpm product:format:check
          pnpm product:lint
          pnpm product:typecheck
          pnpm product:test
          pnpm studio:format:check
          pnpm studio:lint
          pnpm studio:typecheck
          pnpm studio:test
          pnpm studio:build
          cmake --preset product-runtime-debug --fresh
          cmake --build --preset product-runtime-debug-build --clean-first
          foreach ($p in @('artist-gain-warm','artist-gain-bright','artist-gain-inverted')) { pnpm product:export --project "examples/products/$p.garak" --configuration Debug --output out/exports/phase-3d1/debug --force --validate }
          ctest --preset product-runtime-debug-test --no-tests=error
          pnpm --dir studio verify:product-workflow --configuration Debug
          cmake --preset product-runtime-release --fresh
          cmake --build --preset product-runtime-release-build --clean-first
          foreach ($p in @('artist-gain-warm','artist-gain-bright','artist-gain-inverted')) { pnpm product:export --project "examples/products/$p.garak" --configuration Release --output out/exports/phase-3d1/release --force --validate }
          ctest --preset product-runtime-release-test --no-tests=error
          pnpm --dir studio verify:product-workflow --configuration Release
          cmake --preset product-runtime-werror --fresh
          cmake --build --preset product-runtime-werror-build --clean-first
          cmake --preset product-runtime-clang-tidy --fresh
          cmake --build --preset product-runtime-clang-tidy-build --clean-first
          if (@(git status --porcelain --untracked-files=no).Count -ne 0) { throw 'Verification rewrote tracked source.' }
          $remote = git ls-remote origin refs/heads/main
          if (($remote -split "`t")[0] -ne $env:SOURCE_SHA) { throw 'Main moved during verification.' }

  finalize:
    needs: [recover, windows]
    if: needs.recover.outputs.state == 'recovered' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ needs.recover.outputs.source_sha }}
      VERIFY_RUN: ${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Accept Phase 3D1 and clean every one-time file
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          from pathlib import Path
          import os, re
          source=os.environ['SOURCE_SHA']; run=os.environ['VERIFY_RUN']
          p=Path('plans/0018-phase-3d1-polarity-node.md'); t=p.read_text(encoding='utf-8')
          t=t.replace('- Status: In Progress','- Status: Complete',1)
          t=re.sub(r'(?m)^([0-9]+\. )\[ \]',r'\1[x]',t)
          p.write_text(t,encoding='utf-8',newline='\n')
          for name,block in {
            'README.md':f'\n### Phase 3D1 — Polarity Node — Complete\n\nExact direct-main source `{source}` passed clean Windows run `{run}`. Phase 3D remains In Progress.\n',
            'ROADMAP.md':f'\n### Phase 3D1 — Polarity Node — Complete\n\n- exact verified main source: `{source}`\n- clean Windows run: `{run}`\n',
            'docs/status/current.md':f'\n### Phase 3D1 — Polarity Node — Complete\n\nExact direct-main source `{source}` passed clean Windows run `{run}`.\n'
          }.items():
            q=Path(name); s=q.read_text(encoding='utf-8')
            if '### Phase 3D1 — Polarity Node — Complete' not in s: s+=block
            if name=='ROADMAP.md': s=s.replace('## Phase 3D — Initial DSP Node Set — Planned','## Phase 3D — Initial DSP Node Set — In Progress')
            q.write_text(s,encoding='utf-8',newline='\n')
          PY
          git rm .github/workflows/recover-phase3d1-orphan-history-once.yml
          rm -f .github/workflows/apply-phase3d1-main-once.yml .github/workflows/verify-phase3d1-main-once.yml .github/workflows/phase3d1-direct-main-controller-once.yml .github/workflows/reconcile-phase3d1-start-phase3d2-once.yml .github/phase3d1-implementation.patch.gz.b64
          git add -A
          git config user.name "Garak Direct Main Development"
          git config user.email "110483588+andongmin94@users.noreply.github.com"
          git diff --cached --check
          git commit -m "docs: accept Phase 3D1 polarity node"
          git push origin HEAD:main
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main

  cleanup-present:
    needs: recover
    if: needs.recover.outputs.state == 'present'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove redundant recovery workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/recover-phase3d1-orphan-history-once.yml
          git config user.name "Garak Direct Main Development"
          git config user.email "110483588+andongmin94@users.noreply.github.com"
          git commit -m "chore: remove redundant Phase 3D1 recovery"
          git push origin HEAD:main
