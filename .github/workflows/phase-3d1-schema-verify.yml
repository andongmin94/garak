name: phase-3d1-schema-verify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Render exact Prettier output without modifying source
        shell: bash
        run: |
          mkdir -p formatted/studio/tests
          pnpm --dir studio exec prettier tests/product_api.test.mts > formatted/studio/tests/product_api.test.mts
          pnpm --dir studio exec prettier tests/product_service.test.mts > formatted/studio/tests/product_service.test.mts
      - uses: actions/upload-artifact@v4
        with:
          name: phase-3d1-studio-prettier
          path: formatted
          if-no-files-found: error
