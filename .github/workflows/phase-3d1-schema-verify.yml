name: phase-3d1-schema-verify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run all Product Compiler and Studio gates
        shell: bash
        run: |
          set +e
          status=0
          run_gate() {
            echo "::group::$*"
            "$@"
            code=$?
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              status=1
            fi
          }
          run_gate pnpm product:format:check
          run_gate pnpm product:lint
          run_gate pnpm product:typecheck
          run_gate pnpm product:test
          run_gate pnpm studio:format:check
          run_gate pnpm studio:lint
          run_gate pnpm studio:typecheck
          run_gate pnpm studio:test
          run_gate pnpm studio:build
          exit "$status"
