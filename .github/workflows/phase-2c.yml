name: Windows foundation gates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: garak-windows-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Product Compiler and Studio
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install exact workspace dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify repository text and whitespace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git diff --check
          $badEol = @(git ls-files --eol | Select-String 'w/(crlf|mixed)')
          if ($badEol.Count -ne 0) {
            $badEol | ForEach-Object { Write-Error $_.Line }
            throw 'Tracked first-party text must use LF working-tree line endings.'
          }

      - name: Check Product Compiler formatting
        run: pnpm product:format:check

      - name: Show Product Compiler formatting diff
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pnpm product:format
          git diff -- tools/product-compiler

      - name: Upload Product Compiler formatter output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-compiler-format-${{ github.sha }}
          path: |
            tools/product-compiler/src/static_graph.ts
            tools/product-compiler/tests/static_graph.test.ts
          if-no-files-found: error
          retention-days: 1

      - name: Lint Product Compiler
        run: pnpm product:lint

      - name: Type-check Product Compiler
        run: pnpm product:typecheck

      - name: Test Product Compiler
        run: pnpm product:test

      - name: Check Studio formatting
        run: pnpm studio:format:check

      - name: Lint Studio
        run: pnpm studio:lint

      - name: Type-check Studio
        run: pnpm studio:typecheck

      - name: Test Studio
        run: pnpm studio:test

      - name: Build Studio production outputs
        run: pnpm studio:build

      - name: Verify tests and builds did not rewrite tracked source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $changes = @(git status --porcelain --untracked-files=no)
          if ($changes.Count -ne 0) {
            $changes | ForEach-Object { Write-Error $_ }
            throw 'Quality gates modified tracked source.'
          }

  native:
    name: Native Product Runtime and real export path
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and exact SDK graph
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install exact workspace dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify recursive SDK pins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $status = @(git submodule status --recursive)
          $status | ForEach-Object { Write-Host $_ }
          $invalid = @($status | Where-Object { $_ -match '^[+-U]' })
          if ($invalid.Count -ne 0) {
            $invalid | ForEach-Object { Write-Error $_ }
            throw 'A recursive submodule is missing or not at its recorded gitlink.'
          }

      - name: Check first-party C++ formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $files = @(
            git ls-files -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' |
              Where-Object { $_ -notlike 'third_party/*' }
          )
          if ($files.Count -eq 0) {
            throw 'No first-party C/C++ files were found for clang-format.'
          }
          & clang-format --dry-run --Werror --style=file @files

      - name: Show first-party C++ formatting diff
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $files = @(
            git ls-files -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' |
              Where-Object { $_ -notlike 'third_party/*' }
          )
          & clang-format -i --style=file @files
          git diff -- native

      - name: Configure Debug Product Runtime
        run: cmake --preset product-runtime-debug --fresh

      - name: Build Debug Product Runtime
        run: cmake --build --preset product-runtime-debug-build --clean-first

      - name: Export and officially validate Debug products
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm product:export --project examples/products/artist-gain-warm.garak --configuration Debug --output out/exports/phase-1c1/debug --force --validate
          pnpm product:export --project examples/products/artist-gain-bright.garak --configuration Debug --output out/exports/phase-1c1/debug --force --validate

      - name: Test Debug Product Runtime
        run: ctest --preset product-runtime-debug-test --no-tests=error

      - name: Exercise the real Studio Debug product workflow
        run: pnpm --dir studio verify:product-workflow --configuration Debug

      - name: Configure Release Product Runtime
        run: cmake --preset product-runtime-release --fresh

      - name: Build Release Product Runtime
        run: cmake --build --preset product-runtime-release-build --clean-first

      - name: Export and officially validate Release products
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm product:export --project examples/products/artist-gain-warm.garak --configuration Release --output out/exports/phase-1c1/release --force --validate
          pnpm product:export --project examples/products/artist-gain-bright.garak --configuration Release --output out/exports/phase-1c1/release --force --validate

      - name: Test Release Product Runtime
        run: ctest --preset product-runtime-release-test --no-tests=error

      - name: Exercise the real Studio Release product workflow
        run: pnpm --dir studio verify:product-workflow --configuration Release

      - name: Configure warnings-as-errors build
        run: cmake --preset product-runtime-werror --fresh

      - name: Build with first-party warnings as errors
        run: cmake --build --preset product-runtime-werror-build --clean-first

      - name: Configure clang-tidy build
        run: cmake --preset product-runtime-clang-tidy --fresh

      - name: Build with first-party clang-tidy
        run: cmake --build --preset product-runtime-clang-tidy-build --clean-first

      - name: Verify native gates did not rewrite tracked source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $changes = @(git status --porcelain --untracked-files=no)
          if ($changes.Count -ne 0) {
            $changes | ForEach-Object { Write-Error $_ }
            throw 'Native gates modified tracked source.'
          }

  report:
    name: Authoritative commit status
    if: always()
    needs:
      - typescript
      - native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the final commit status
        uses: actions/github-script@v7
        with:
          script: |
            const passed =
              '${{ needs.typescript.result }}' === 'success' &&
              '${{ needs.native.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'garak/windows-foundation',
              description: passed
                ? 'Authoritative Windows foundation gates passed'
                : 'One or more authoritative Windows foundation gates failed',
              target_url:
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!passed) {
              core.setFailed('The authoritative Windows foundation gates did not all pass.');
            }
