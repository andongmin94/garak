name: Phase 2C compatibility gates

on:
  push:
    branches:
      - main
    paths:
      - "tools/product-compiler/**"
      - "native/runtime/product_v1/**"
      - "native/tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/phase-2c.yml"
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PHASE_2C_TRIGGER_TITLE: "[trigger] Phase 2C compatibility gates"

jobs:
  product-compiler:
    if: github.event_name != 'issues' || github.event.issue.title == '[trigger] Phase 2C compatibility gates'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Activate pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile

      - name: Product Compiler gates
        shell: pwsh
        run: |
          pnpm product:format:check
          pnpm product:lint
          pnpm product:typecheck
          pnpm product:test

      - name: Studio regression gates
        shell: pwsh
        run: |
          pnpm studio:format:check
          pnpm studio:lint
          pnpm studio:typecheck
          pnpm studio:test
          pnpm studio:build

  native:
    if: github.event_name != 'issues' || github.event.issue.title == '[trigger] Phase 2C compatibility gates'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Activate pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Debug Product Runtime
        shell: pwsh
        run: |
          cmake --preset product-runtime-debug
          cmake --build --preset product-runtime-debug-build
          pnpm product:export --project examples/products/artist-gain-warm.garak --configuration Debug --output out/exports/phase-1c1/debug --force --validate
          pnpm product:export --project examples/products/artist-gain-bright.garak --configuration Debug --output out/exports/phase-1c1/debug --force --validate
          ctest --preset product-runtime-debug-test --no-tests=error

      - name: Release Product Runtime
        shell: pwsh
        run: |
          cmake --preset product-runtime-release
          cmake --build --preset product-runtime-release-build
          pnpm product:export --project examples/products/artist-gain-warm.garak --configuration Release --output out/exports/phase-1c1/release --force --validate
          pnpm product:export --project examples/products/artist-gain-bright.garak --configuration Release --output out/exports/phase-1c1/release --force --validate
          ctest --preset product-runtime-release-test --no-tests=error

      - name: First-party warnings as errors
        shell: pwsh
        run: |
          cmake --preset product-runtime-werror
          cmake --build --preset product-runtime-werror-build

      - name: First-party clang-tidy
        shell: pwsh
        run: |
          cmake --preset product-runtime-clang-tidy
          cmake --build --preset product-runtime-clang-tidy-build

  report:
    if: always() && (github.event_name != 'issues' || github.event.issue.title == '[trigger] Phase 2C compatibility gates')
    needs:
      - product-compiler
      - native
    runs-on: ubuntu-latest
    steps:
      - name: Publish Phase 2C gate result
        uses: actions/github-script@v7
        with:
          script: |
            const passed =
              '${{ needs.product-compiler.result }}' === 'success' &&
              '${{ needs.native.result }}' === 'success';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] Phase 2C ${passed ? 'passed' : 'failed'} ${context.sha}`,
              body: [
                `Commit: ${context.sha}`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Product Compiler and Studio: ${{ needs.product-compiler.result }}`,
                `Native Product Runtime: ${{ needs.native.result }}`,
              ].join('\n'),
            });
