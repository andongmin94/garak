name: Source snapshot once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/source-snapshot-once.yml

permissions:
  contents: read

env:
  GARAK_SOURCE_SHA: 9ebb380bf948a4de89a0b6dc3e476cf6a359e53a

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GARAK_SOURCE_SHA }}
          submodules: false

      - name: Confirm exact commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GARAK_SOURCE_SHA"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: garak-source-${{ env.GARAK_SOURCE_SHA }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
