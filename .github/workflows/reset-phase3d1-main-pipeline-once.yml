name: Reset Phase 3D1 direct-main pipeline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reset-phase3d1-main-pipeline-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: garak-phase3d1-pipeline-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel every other queued or running workflow
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress waiting requested pending; do
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null || true)
          done
          sleep 20

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove competing workflows and retrigger one clean implementation run
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test -f .github/workflows/phase3d1-main-implementation-once.yml

          find .github/workflows -maxdepth 1 -type f -name '*once.yml' \
            ! -name 'phase3d1-main-implementation-once.yml' \
            ! -name 'reset-phase3d1-main-pipeline-once.yml' \
            -print -delete
          rm -f .github/workflows/phase3d1-main-guardian-once.yml
          rm -f .github/phase3d1-implementation.patch.gz.b64

          python - <<'PY'
          from pathlib import Path
          import os
          path = Path('.github/workflows/phase3d1-main-implementation-once.yml')
          text = path.read_text(encoding='utf-8')
          lines = [line for line in text.splitlines() if not line.startswith('# pipeline-generation: ')]
          lines.append(f'# pipeline-generation: {os.environ["GITHUB_RUN_ID"]}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

          git rm .github/workflows/reset-phase3d1-main-pipeline-once.yml
          git add -A
          git config user.name 'Garak Direct Main Development'
          git config user.email '110483588+andongmin94@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'ci: start clean Phase 3D1 direct-main run'
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$final_sha"

      - name: Confirm main-only repository shape
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main
          test -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq '.[].number')"
