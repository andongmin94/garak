name: Reconcile Phase 3D1 and start Phase 3D2 on main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-phase3d1-start-phase3d2-once.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: garak-direct-main-phase3d1-controller
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    outputs:
      state: ${{ steps.inspect.outputs.state }}
      source_sha: ${{ steps.inspect.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Inspect accepted or acceptance-pending source
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          while IFS= read -r full_ref; do
            [ -n "$full_ref" ] || continue
            branch="${full_ref#refs/heads/}"
            [ "$branch" = "main" ] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/" --jq '.[].ref')
          test -f plans/0018-phase-3d1-polarity-node.md
          if test -f native/dsp/polarity/include/garak/dsp/polarity/polarity.hpp \
             && test -f examples/products/artist-gain-inverted.garak/product.json; then
            if grep -Fq -- '- Status: Complete' plans/0018-phase-3d1-polarity-node.md; then
              echo 'state=complete' >> "$GITHUB_OUTPUT"
            else
              grep -Fq -- '- Status: In Progress' plans/0018-phase-3d1-polarity-node.md
              echo 'state=verify' >> "$GITHUB_OUTPUT"
            fi
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'Phase 3D1 implementation is absent on current main.' >&2
          exit 1

  windows:
    needs: inspect
    if: needs.inspect.outputs.state == 'verify'
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Check out exact source and recursive SDK graph
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Run complete Phase 3D1 acceptance matrix
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Wrong source SHA.' }
          $status = @(git submodule status --recursive)
          if (@($status | Where-Object { $_ -match '^[+-U]' }).Count -ne 0) { throw 'Recursive SDK pin mismatch.' }
          git diff --check
          $files = @(git ls-files -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | Where-Object { $_ -notlike 'third_party/*' })
          & clang-format --dry-run --Werror --style=file @files
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile
          pnpm product:format:check
          pnpm product:lint
          pnpm product:typecheck
          pnpm product:test
          pnpm studio:format:check
          pnpm studio:lint
          pnpm studio:typecheck
          pnpm studio:test
          pnpm studio:build
          cmake --preset product-runtime-debug --fresh
          cmake --build --preset product-runtime-debug-build --clean-first
          pnpm product:export --project examples/products/artist-gain-warm.garak --configuration Debug --output out/exports/phase-3d1/debug --force --validate
          pnpm product:export --project examples/products/artist-gain-bright.garak --configuration Debug --output out/exports/phase-3d1/debug --force --validate
          pnpm product:export --project examples/products/artist-gain-inverted.garak --configuration Debug --output out/exports/phase-3d1/debug --force --validate
          ctest --preset product-runtime-debug-test --no-tests=error
          pnpm --dir studio verify:product-workflow --configuration Debug
          cmake --preset product-runtime-release --fresh
          cmake --build --preset product-runtime-release-build --clean-first
          pnpm product:export --project examples/products/artist-gain-warm.garak --configuration Release --output out/exports/phase-3d1/release --force --validate
          pnpm product:export --project examples/products/artist-gain-bright.garak --configuration Release --output out/exports/phase-3d1/release --force --validate
          pnpm product:export --project examples/products/artist-gain-inverted.garak --configuration Release --output out/exports/phase-3d1/release --force --validate
          ctest --preset product-runtime-release-test --no-tests=error
          pnpm --dir studio verify:product-workflow --configuration Release
          cmake --preset product-runtime-werror --fresh
          cmake --build --preset product-runtime-werror-build --clean-first
          cmake --preset product-runtime-clang-tidy --fresh
          cmake --build --preset product-runtime-clang-tidy-build --clean-first
          $changes = @(git status --porcelain --untracked-files=no)
          if ($changes.Count -ne 0) { throw 'Verification rewrote tracked source.' }
          $remote = git ls-remote origin refs/heads/main
          if (($remote -split "`t")[0] -ne $env:SOURCE_SHA) { throw 'Main moved during verification.' }

  advance:
    needs: [inspect, windows]
    if: always() && needs.inspect.result == 'success' && (needs.inspect.outputs.state == 'complete' || needs.windows.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
      VERIFY_RUN: ${{ github.run_id }}
      D1_STATE: ${{ needs.inspect.outputs.state }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Accept Phase 3D1 if needed and create Phase 3D2 plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          source = os.environ['SOURCE_SHA']
          run = os.environ['VERIFY_RUN']
          d1_state = os.environ['D1_STATE']

          if d1_state == 'verify':
              plan_path = Path('plans/0018-phase-3d1-polarity-node.md')
              plan = plan_path.read_text(encoding='utf-8')
              plan = plan.replace('- Status: In Progress', '- Status: Complete', 1)
              plan = re.sub(r'(?m)^([0-9]+\. )\[ \]', r'\1[x]', plan)
              marker = '## 완료 기록\n\n'
              completion = (
                  f'Phase 3D1 is complete. Exact direct-main source `{source}` passed clean Windows run `{run}`. '
                  'Product Compiler, Studio, Debug/Release actual export and official Validator, CTest, Studio workflow, '
                  'warnings-as-errors, clang-tidy and tracked-source mutation zero all passed. Existing identity, parameter, '
                  'compiled-product, state and whole-product Bypass contracts are preserved.\n'
              )
              start = plan.find(marker)
              end = plan.find('\n## 다음 단계', start + len(marker)) if start >= 0 else -1
              if start >= 0 and end >= 0:
                  plan = plan[:start + len(marker)] + completion + plan[end:]
              plan_path.write_text(plan, encoding='utf-8', newline='\n')

              additions = {
                  'README.md': f'''\n### Phase 3D1 — Polarity Node — Complete\n\nExact direct-main source `{source}` passed clean Windows run `{run}`. Current products support exact Gain-only and Gain→Polarity plans, project schema v4, graph source v2, deterministic `GARAKGRF` 1.1, whole-product Bypass, and the `Artist Gain Inverted` reference product.\n''',
                  'ROADMAP.md': f'''\n### Phase 3D1 — Polarity Node — Complete\n\n- exact verified main source: `{source}`\n- clean Windows run: `{run}`\n- fixed parameterless Polarity v1\n- schema v4 / graph source v2 / `GARAKGRF` 1.1\n''',
                  'docs/status/current.md': f'''\n### Phase 3D1 — Polarity Node — Complete\n\nExact direct-main source `{source}` passed clean Windows run `{run}`. Runtime supports exact Gain-only and Gain→Polarity plans with whole-product Bypass and allocation-free processing.\n''',
              }
              for path, addition in additions.items():
                  file = Path(path)
                  text = file.read_text(encoding='utf-8')
                  if '### Phase 3D1 — Polarity Node — Complete' not in text:
                      text += addition
                  if path == 'ROADMAP.md':
                      text = text.replace('## Phase 3D — Initial DSP Node Set — Planned', '## Phase 3D — Initial DSP Node Set — In Progress')
                  file.write_text(text, encoding='utf-8', newline='\n')

          pan_plan = Path('plans/0019-phase-3d2-pan-node.md')
          if not pan_plan.exists():
              pan_plan.write_text('''# ExecPlan 0019 — Phase 3D2 Fixed Pan Node\n\n- Status: In Progress\n- Started: 2026-09-04\n- Updated: 2026-09-04\n- Owner: Product Compiler, Native static graph Runtime and Studio product workflow\n\n## 목적\n\nPhase 3D1의 accepted Polarity baseline 위에 fixed Pan node implementation 1을 project source, deterministic compiled graph, Native execution, realtime tests와 actual Windows VST3 export까지 end-to-end로 추가한다. 모든 개발과 검증은 `main`에서 직접 수행한다.\n\n## 사용자 가치\n\n제품 제작자는 새 host parameter나 macro system 없이도 제품 그래프에 고정된 stereo positioning을 포함할 수 있다. Gain-only와 Polarity 제품은 그대로 유지되고, Pan 제품의 소리도 project-owned versioned source에서 결정적으로 생성된다.\n\n## 현재 저장소 상태\n\n- Phase 3D1 Polarity: Complete on direct `main`\n- Current project schema: v4\n- Current graph source: v2\n- Current compiled graph: `GARAKGRF` 1.1\n- Public Parameter IDs: Gain `1001`, Bypass `1002`\n- Branch policy: `main` only; no development or verification branches and no PR staging\n\n## 범위\n\n- fixed Pan DSP node implementation version 1\n- project-owned finite `pan` value in inclusive `[-1, 1]`\n- mono identity processing\n- stereo center-unity balance law: center `(1,1)`, hard left `(1,0)`, hard right `(0,1)`\n- project schema v5 and graph source v3 with explicit v4→v5 migration\n- exact current topologies: Gain-only, Gain→Polarity, or Gain→Pan\n- deterministic `GARAKGRF` 1.2 and explicit old-artifact rebuild disposition\n- module-load prepared immutable Pan coefficients\n- whole-product sample-accurate Bypass and allocation-free processing\n- one panned reference product and complete Debug/Release export/Validator coverage\n- Product Compiler, Native Runtime, inspector, realtime stress and Studio workflow regressions\n\n## 비범위\n\n- host-exposed Pan parameter or new Parameter ID\n- changing `GARAKCPD` or `GARAKPST`\n- combined Polarity→Pan topology\n- Dry/Wet, Biquad, Tilt EQ or Saturation\n- arbitrary DAG, branching, sidechain, dynamic scheduler or graph editing UI\n\n## 설계 결정\n\nPan is immutable product graph configuration in Phase 3D2, not a host parameter. For stereo, negative values attenuate the right channel linearly while the left stays at unity; positive values attenuate the left while the right stays at unity. Mono remains identity. Coefficients are computed during binding preparation, not in the audio callback.\n\n## 구현 단계\n\n1. [x] Write this ExecPlan on accepted direct-main Phase 3D1.\n2. [ ] Add Pan DSP and direct mono/stereo Float32/Float64 tests.\n3. [ ] Evolve schema v5 / graph source v3 with strict three-topology validation.\n4. [ ] Add v4→v5 migration preserving existing Gain and Polarity sound semantics.\n5. [ ] Evolve deterministic compiled graph to `GARAKGRF` 1.2.\n6. [ ] Add immutable Pan binding and exact execution.\n7. [ ] Preserve whole-product Bypass and zero allocation/deallocation.\n8. [ ] Add panned reference product and extend inspector/Studio/export coverage.\n9. [ ] Update architecture/status/roadmap to acceptance-pending Phase 3D2.\n10. [ ] Run local Product Compiler, Studio and Native gates.\n11. [ ] Commit implementation directly to `main` and run exact-main clean Windows full matrix.\n12. [ ] Mark Complete only after a green exact-main gate and remove every one-time workflow.\n\n## 검증 계획\n\nRun Product Compiler and Studio format/lint/typecheck/test/build, Native Debug/Release tests, direct Pan DSP tests, realtime allocation stress, actual Warm/Bright/Inverted/Panned Debug and Release exports, official VST3 Validator, CTest, Studio product workflow, warnings-as-errors, clang-tidy and tracked-source mutation zero.\n\n## 수용 기준\n\nPan output follows the documented mono/stereo law for in-place and out-of-place Float32/Float64 processing; bypass copies exact dry input; existing products retain identity/default/state behavior; source order and authoring IDs do not affect compiled bytes; old graph artifacts rebuild; future/corrupt data rejects; the exact current `main` commit passes the complete Windows matrix.\n\n## 리스크\n\nA generic graph engine or parameter system would exceed this increment. The implementation accepts only the three explicit linear plans and stores no new public parameter/state identity.\n\n## 발견 사항\n\n- 2026-09-04: Direct-main-only policy replaces the previous temporary-branch workflow.\n\n## 의사결정 로그\n\n- 2026-09-04: Use a fixed Pan property and center-unity balance law before the Phase 4 host parameter/macro system.\n\n## 완료 기록\n\nImplementation has not started.\n\n## 다음 단계\n\nComplete Phase 3D2 on `main` before selecting Dry/Wet or another node.\n''', encoding='utf-8', newline='\n')
          PY
          rm -f .github/phase3d1-implementation.patch.gz.b64
          rm -f .github/workflows/apply-phase3d1-main-once.yml
          rm -f .github/workflows/verify-phase3d1-main-once.yml
          rm -f .github/workflows/phase3d1-direct-main-controller-once.yml
          git rm .github/workflows/reconcile-phase3d1-start-phase3d2-once.yml
          git add -A
          git config user.name "Garak Direct Main Development"
          git config user.email "110483588+andongmin94@users.noreply.github.com"
          git diff --cached --check
          git commit -m "plan: start Phase 3D2 fixed Pan node"
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$final_sha"
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = "main"
