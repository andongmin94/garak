name: Phase 2B.1 gates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  typescript:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Activate pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded persistence fixes
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');

          const sourcePath = 'tools/product-compiler/src/project_persistence.ts';
          let source = fs.readFileSync(sourcePath, 'utf8').replace(/\r\n/g, '\n');

          if (!source.includes('const LOCK_KEYS = Object.freeze([')) {
            const marker = 'const MANIFEST_KEYS = Object.freeze([';
            if (!source.includes(marker)) throw new Error('LOCK_KEYS insertion marker missing');
            source = source.replace(
              marker,
              `const LOCK_KEYS = Object.freeze([\n  "type",\n  "version",\n  "transactionId",\n  "operation",\n  "targetKey",\n  "productId",\n  "expectedRevision",\n  "processId",\n  "createdAt",\n]);\n\n${marker}`,
            );
          }

          if (!source.includes('function parseLock(text: string): PersistenceLock')) {
            const marker = `async function readManifest(filePath: string): Promise<PersistenceManifest> {\n  return parseManifest(await readFile(filePath, "utf8"));\n}\n\n`;
            if (!source.includes(marker)) throw new Error('lock parser insertion marker missing');
            source = source.replace(
              marker,
              marker + `function parseLock(text: string): PersistenceLock {\n  const parsed = parseStrictJson(text, {\n    sourcePath: "project.persistence.lock",\n    syntaxCode: "GARAK_PROJECT_TRANSACTION_LOCK_JSON",\n    duplicateCode: "GARAK_PROJECT_TRANSACTION_LOCK_DUPLICATE",\n  });\n  if (!isJsonObject(parsed)) {\n    persistenceFailure(\n      "GARAK_PROJECT_TRANSACTION_LOCK_SHAPE",\n      "lock",\n      "Persistence lock must be a JSON object.",\n    );\n  }\n  assertExactKeys(parsed, LOCK_KEYS);\n  const operation = requireString(parsed.operation, "operation");\n  const lock: PersistenceLock = {\n    type: requireString(parsed.type, "type") as typeof LOCK_TYPE,\n    version: parsed.version as typeof MANIFEST_VERSION,\n    transactionId: requireString(parsed.transactionId, "transactionId"),\n    operation: operation as PersistenceOperation,\n    targetKey: requireString(parsed.targetKey, "targetKey"),\n    productId: requireString(parsed.productId, "productId"),\n    expectedRevision: requireString(parsed.expectedRevision, "expectedRevision"),\n    processId: parsed.processId as number,\n    createdAt: requireString(parsed.createdAt, "createdAt"),\n  };\n  if (\n    lock.type !== LOCK_TYPE ||\n    lock.version !== MANIFEST_VERSION ||\n    !TRANSACTION_ID.test(lock.transactionId) ||\n    (lock.operation !== "save" && lock.operation !== "migrate-in-place") ||\n    !/^[0-9a-f]{32}$/u.test(lock.targetKey) ||\n    !PRODUCT_ID.test(lock.productId) ||\n    !SHA256.test(lock.expectedRevision) ||\n    !Number.isSafeInteger(lock.processId) ||\n    lock.processId <= 0 ||\n    Number.isNaN(Date.parse(lock.createdAt))\n  ) {\n    persistenceFailure(\n      "GARAK_PROJECT_TRANSACTION_LOCK_VALUE",\n      "lock",\n      "Persistence lock contains an invalid value.",\n    );\n  }\n  return lock;\n}\n\nasync function readLock(layout: ProjectLayout): Promise<PersistenceLock | null> {\n  if (!(await pathExists(layout.lockPath))) return null;\n  return parseLock(await readFile(layout.lockPath, "utf8"));\n}\n\nfunction processIsAlive(processId: number): boolean {\n  if (processId === process.pid) return true;\n  try {\n    process.kill(processId, 0);\n    return true;\n  } catch (error) {\n    if (error instanceof Error && "code" in error && error.code === "ESRCH") {\n      return false;\n    }\n    return true;\n  }\n}\n\n`,
            );
          }

          if (!source.includes('Another process still owns the project persistence transaction.')) {
            const marker = `  const manifest = await readManifest(\n    path.join(transactionDirectory, MANIFEST_FILENAME),\n  );\n`;
            if (!source.includes(marker)) throw new Error('active lock insertion marker missing');
            source = source.replace(
              marker,
              marker + `  const lock = await readLock(layout);\n  if (\n    lock !== null &&\n    (lock.transactionId !== manifest.transactionId ||\n      lock.targetKey !== manifest.targetKey ||\n      lock.productId !== manifest.productId ||\n      lock.operation !== manifest.operation)\n  ) {\n    persistenceFailure(\n      "GARAK_PROJECT_RECOVERY_AMBIGUOUS",\n      "recovery",\n      "Persistence lock does not match the unresolved transaction manifest.",\n    );\n  }\n  if (lock !== null && processIsAlive(lock.processId)) {\n    persistenceFailure(\n      "GARAK_PROJECT_TRANSACTION_LOCKED",\n      "lock",\n      "Another process still owns the project persistence transaction.",\n    );\n  }\n`,
            );
          }
          fs.writeFileSync(sourcePath, source);

          const testPath = 'tools/product-compiler/tests/project_persistence.test.ts';
          let tests = fs.readFileSync(testPath, 'utf8').replace(/\r\n/g, '\n');
          if (!tests.includes('  realpath,\n')) {
            tests = tests.replace('  readFile,\n  rename,', '  readFile,\n  realpath,\n  rename,');
          }
          tests = tests.replace(
            '          source === projectDirectory &&\n          destination.includes("garak-backup")',
            '          path.basename(source) === path.basename(projectDirectory) &&\n          destination.includes("garak-backup")',
          );
          tests = tests.replace(
            '.update(path.normalize(projectDirectory).toUpperCase(), "utf8")',
            '.update(\n        path.normalize(await realpath(projectDirectory)).toUpperCase(),\n        "utf8",\n      )',
          );
          fs.writeFileSync(testPath, tests);
          NODE

      - name: Apply canonical Product Compiler formatting
        shell: pwsh
        run: |
          pnpm product:format
          git diff --check

      - name: Product Compiler gates
        shell: pwsh
        run: |
          pnpm product:lint
          pnpm product:typecheck
          pnpm product:test

      - name: Studio gates
        shell: pwsh
        run: |
          pnpm studio:format:check
          pnpm studio:lint
          pnpm studio:typecheck
          pnpm studio:test
          pnpm studio:build

      - name: Publish validated persistence fixes
        shell: pwsh
        run: |
          $changed = git status --porcelain -- tools/product-compiler/src/project_persistence.ts tools/product-compiler/tests/project_persistence.test.ts
          if ($changed) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- tools/product-compiler/src/project_persistence.ts tools/product-compiler/tests/project_persistence.test.ts
            git commit -m "fix: preserve active phase 2B.1 persistence transactions"
            git push origin HEAD:main
          }

  native-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure, build, and test Debug scaffold
        shell: pwsh
        run: |
          cmake --preset debug
          cmake --build --preset debug-build
          ctest --preset debug-test --no-tests=error

  report:
    if: always()
    needs:
      - typescript
      - native-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Publish machine-readable gate result
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] Phase 2B.1 ${context.sha}`;
            const body = [
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `TypeScript and Studio: ${{ needs.typescript.result }}`,
              `Native smoke: ${{ needs.native-smoke.result }}`,
            ].join('\n');
            const { data: matches } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = matches.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: 'open',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
