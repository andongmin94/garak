name: Phase 2B.1 gates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  typescript:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Activate pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Product Compiler formatting
        shell: pwsh
        run: |
          pnpm product:format
          git diff --check

      - name: Product Compiler gates
        shell: pwsh
        run: |
          pnpm product:lint
          pnpm product:typecheck
          pnpm product:test

      - name: Studio gates
        shell: pwsh
        run: |
          pnpm studio:format:check
          pnpm studio:lint
          pnpm studio:typecheck
          pnpm studio:test
          pnpm studio:build

      - name: Publish canonical formatting
        shell: pwsh
        run: |
          $changed = git status --porcelain -- tools/product-compiler/src/project_persistence.ts tools/product-compiler/tests/project_persistence.test.ts
          if ($changed) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- tools/product-compiler/src/project_persistence.ts tools/product-compiler/tests/project_persistence.test.ts
            git commit -m "style: apply canonical phase 2B.1 formatting"
            git push origin HEAD:main
          }

  native-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure, build, and test Debug scaffold
        shell: pwsh
        run: |
          cmake --preset debug
          cmake --build --preset debug-build
          ctest --preset debug-test --no-tests=error

  report:
    if: always()
    needs:
      - typescript
      - native-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Publish machine-readable gate result
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] Phase 2B.1 ${context.sha}`;
            const body = [
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `TypeScript and Studio: ${{ needs.typescript.result }}`,
              `Native smoke: ${{ needs.native-smoke.result }}`,
            ].join('\n');
            const { data: matches } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = matches.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: 'open',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
